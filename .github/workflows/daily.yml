# Job sau phiên. 08:35 UTC = 15:35 giờ VN — để DNSE có thời gian chốt nến ATC. Các cron dự phòng (16:05, 16:45,
# 18:10 VN) chạy lại nếu lần trước bị GitHub trễ/bỏ HOẶC nguồn chưa chốt nến hôm đó — job
# idempotent nên có file hôm nay rồi thì thoát ngay.
name: daily

on:
  schedule:
    - cron: "35 8 * * 1-5"
    - cron: "5 9 * * 1-5"
    - cron: "45 9 * * 1-5"
    - cron: "10 11 * * 1-5"
  # Đẩy code hoặc settings.json mới lên → chạy ngay (idempotent, ~1 phút, miễn phí).
  # Commit của chính job mang [skip ci] nên không tự kích hoạt vòng lặp.
  # Danh mục nằm ở Settings → Secrets and variables → Actions → Variables → WATCHLIST. Đổi Variable
  # KHÔNG tự kích hoạt workflow: bấm Run workflow (hoặc chờ cron 15:35) để mã mới được quét.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Chạy lại dù hôm nay đã có file"
        default: "false"
      test_push:
        description: "Gửi một thông báo thử tới mọi máy đã đăng ký"
        default: "false"

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Thông báo thử (khi bấm workflow_dispatch với test_push=true)
        if: ${{ github.event.inputs.test_push == 'true' }}
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          PUSH_SUBS_FALLBACK: ${{ secrets.PUSH_SUBS_FALLBACK }}
          WATCHLIST: ${{ vars.WATCHLIST }}
        run: python -m job.push --test

      - name: Quét mẫu hình nến + push
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          PUSH_SUBS_FALLBACK: ${{ secrets.PUSH_SUBS_FALLBACK }}
          WATCHLIST: ${{ vars.WATCHLIST }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE=--force; else FORCE=; fi
          python -m job.run_daily $FORCE

      - name: Commit kết quả
        run: |
          git config user.name "candle-watch-bot"
          git config user.email "candle-watch-bot@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then echo "không có gì mới"; exit 0; fi
          git commit -m "daily: $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase
          git push
